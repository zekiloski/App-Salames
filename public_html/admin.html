<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a1424">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Salame Monitor">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>Salame Monitor · Administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=(c.closest('table').rows[0].cells[i]||{}).textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="banner" id="prueba" hidden>Modo prueba · los datos quedan solo en este navegador <button class="btn sm" id="borrarPrueba">Borrar datos de prueba</button></div>
<header>
  <div class="brand">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <h1>Salame Monitor</h1>
    <div class="sub">Panel de administrador</div>
  </div>
  <nav id="menu" aria-label="Secciones" tabindex="-1">
    <div class="drawer-head"><b>Administrador</b><button class="menu-btn" id="menuClose" aria-label="Cerrar menú"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>
    <div class="tabs">
      <a href="#s-caidos"><svg class="ic" aria-hidden="true"><use href="#i-sinSenal"/></svg>Equipos sin datos<span class="badge" id="caidosBadge" hidden></span></a>
      <a href="#s-clientes"><svg class="ic" aria-hidden="true"><use href="#i-empresa"/></svg>Clientes</a>
      <a href="#fEmpresa"><svg class="ic" aria-hidden="true"><use href="#i-usuarios"/></svg>Nueva empresa</a>
      <a href="index.html"><svg class="ic" aria-hidden="true"><use href="#i-vivo"/></svg>Panel del salamero</a>
    </div>
    <div class="user" id="user" hidden><span id="userName"></span><button class="btn sm" id="salir"><svg class="ic" aria-hidden="true"><use href="#i-salir"/></svg>Salir</button></div>
  </nav>
</header>
<div class="scrim" id="scrim" hidden></div>

<section class="band login" id="login" hidden>
  <form class="panel" id="loginForm">
    <h2>Ingresar</h2>
    <label>Mail<input type="email" name="email" autocomplete="username" required></label>
    <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn pri">Entrar</button>
    <button class="btn" type="button" id="verPrueba">Probar sin servidor (modo prueba)</button>
  </form>
</section>

<main class="band" id="admin" hidden>
  <div class="secreto" id="secreto" hidden role="status"></div>

  <div class="panel" id="s-caidos">
    <h3><svg class="ic" aria-hidden="true"><use href="#i-sinSenal"/></svg>Equipos sin datos</h3>
    <div id="caidos"></div>
  </div>

  <div class="panel" id="s-clientes" style="margin-top:16px">
    <div class="row"><h3 style="margin:0"><svg class="ic" aria-hidden="true"><use href="#i-empresa"/></svg>Clientes</h3></div>
    <div class="scroll"><table class="stack"><thead><tr><th>Empresa</th><th>Contacto</th><th>Estado</th><th class="n">Cámaras</th><th class="n">Usuarios</th><th></th></tr></thead><tbody id="empresas"></tbody></table></div>
    <form class="form inline" id="fEmpresa">
      <label>Nueva empresa<input name="nombre" required placeholder="Nombre del salamero"></label>
      <label>Contacto<input name="contacto" placeholder="Teléfono o mail"></label>
      <button class="btn pri">Dar de alta</button>
    </form>
  </div>

  <div id="detalle"></div>
</main>
<script src="assets/ui.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
